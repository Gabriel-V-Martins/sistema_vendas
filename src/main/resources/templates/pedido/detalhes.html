<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Detalhes do Pedido</title>
    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h1 th:text="|Pedido #${pedido.id}|"></h1>
    <p>Cliente: <span th:text="${pedido.cliente.nome}"></span></p>
    <p>Data: <span th:text="${#temporals.format(pedido.dataPedido, 'dd/MM/yyyy HH:mm')}"></span></p>
    <p>Status: <span th:text="${pedido.status}"></span></p>
    <table class="table table-bordered table-striped">
        <thead><tr><th>Produto</th><th>Quantidade</th><th>Preço unitário (R$)</th><th>Subtotal (R$)</th></tr></thead>
        <tbody>
        <tr th:if="${#lists.isEmpty(pedido.itens)}"><td colspan="4">Nenhum item adicionado.</td></tr>
        <tr th:each="item : ${pedido.itens}">
            <td th:text="${item.produto.nome}"></td>
            <td th:text="${item.quantidade}"></td>
            <td th:text="${#numbers.formatDecimal(item.precoUnitario, 1, 'POINT', 2, 'COMMA')}"></td>
            <td th:text="${#numbers.formatDecimal(item.precoUnitario * item.quantidade, 1, 'POINT', 2, 'COMMA')}"></td>
        </tr>
        </tbody>
    </table>
    <p class="fw-bold">Total: R$ <span th:text="${#numbers.formatDecimal(pedido.valorTotal, 1, 'POINT', 2, 'COMMA')}"></span></p>
    <a class="btn btn-secondary" th:href="@{/pedidos}">Voltar</a>
</div>
</body>
</html>
